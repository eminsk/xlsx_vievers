name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.python-version, '3.16') || contains(matrix.python-version, 'pypy') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.16"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "3.16t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"
          - "pypy-3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup_python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies (Linux)
        if: steps.setup_python.outcome == 'success' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        if: steps.setup_python.outcome == 'success'
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install "openpyxl>=3.1.0" "typing-extensions>=4.0; python_version < '3.10'"
          python -m pip install "xlrd>=2.0.1" "xlwt>=1.3.0" || true
          python -m pip install "ttkbootstrap>=1.10.0" --only-binary :all: || true
          python -m pip install -e . --no-build-isolation --no-deps || python -m pip install -e . --no-deps

      - name: Run tests (pytest)
        if: steps.setup_python.outcome == 'success'
        run: pytest -v tests/
